
---
# Task 1: Install Java and required utilities.
- name: Install required packages
  ansible.builtin.dnf:
    name:
      - java-21-amazon-corretto-headless
      - tar
      - gzip
    state: present
    update_cache: true

# Task 2: Create Kafka installation directory.
- name: Create Kafka installation directory
  ansible.builtin.file:
    path: "{{ kafka_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Task 3: Check cached Kafka archive on Jenkins controller.
- name: Check cached Kafka archive
  ansible.builtin.stat:
    path: "/tmp/kafka_{{ kafka_version }}.tgz"
  register: kafka_archive_cache
  delegate_to: localhost
  become: false
  run_once: true

# Task 4: Download Kafka only when archive is missing.
- name: Download Kafka archive on Jenkins controller
  ansible.builtin.get_url:
    url: "https://archive.apache.org/dist/kafka/{{ kafka_version }}/kafka_2.13-{{ kafka_version }}.tgz"
    dest: "/tmp/kafka_{{ kafka_version }}.tgz"
    mode: "0644"
    timeout: 120
  delegate_to: localhost
  become: false
  run_once: true
  when: not kafka_archive_cache.stat.exists

# Task 5: Transfer archive to private Kafka EC2 through SSM.
- name: Transfer Kafka archive to Kafka EC2
  ansible.builtin.copy:
    src: "/tmp/kafka_{{ kafka_version }}.tgz"
    dest: "/tmp/kafka_{{ kafka_version }}.tgz"
    mode: "0644"
  become: true

# Task 6: Extract Kafka archive.
- name: Extract Kafka archive
  ansible.builtin.unarchive:
    src: "/tmp/kafka_{{ kafka_version }}.tgz"
    dest: "{{ kafka_install_dir }}"
    remote_src: true
    extra_opts:
      - "--strip-components=1"
    creates: "{{ kafka_install_dir }}/bin/kafka-server-start.sh"

# Task 7: Create Kafka group.
- name: Create Kafka group
  ansible.builtin.group:
    name: kafka
    system: true
    state: present

# Task 8: Create Kafka user.
- name: Create Kafka user
  ansible.builtin.user:
    name: kafka
    group: kafka
    system: true
    shell: /sbin/nologin
    home: "{{ kafka_data_dir }}"
    create_home: false
    state: present

# Task 9: Create Kafka data directory.
- name: Create Kafka data directory
  ansible.builtin.file:
    path: "{{ kafka_data_dir }}"
    state: directory
    owner: kafka
    group: kafka
    mode: "0750"

# Task 10: Create Kafka logs directory.
- name: Create Kafka runtime logs directory
  ansible.builtin.file:
    path: "{{ kafka_install_dir }}/logs"
    state: directory
    owner: kafka
    group: kafka
    mode: "0755"
